<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rwanda Online Deals - Ubwishyu</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .checkout-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }

    .checkout-card h2 {
      color: #2c3e50;
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 10px;
    }

    .order-summary {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .order-summary div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: #495057;
    }

    .order-summary div:last-child {
      margin-bottom: 0;
      font-weight: bold;
      color: #212529;
      font-size: 16px;
      border-top: 1px dashed #dee2e6;
      padding-top: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #a0c4ff;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-pending {
      background-color: #e2e3e5;
      color: #383d41;
      border: 1px solid #d6d8db;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #007bff;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <h2>Kora Ubwishyu</h2>
    
    <div class="order-summary">
      <div>
        <span>Igicuruzwa:</span>
        <strong id="displayItemName">Soma amakuru...</strong>
      </div>
      <div>
        <span>Igiciro cyose:</span>
        <span id="displayItemPrice">... RWF</span>
      </div>
    </div>

    <form id="paymentForm">
      <div class="form-group">
        <label for="phoneNumber">Nimero ya Telefoni (MTN / Airtel):</label>
        <input 
          type="tel" 
          id="phoneNumber" 
          placeholder="078XXXXXXX cyangwa 25078XXXXXXX" 
          required
        />
      </div>

      <button type="submit" id="payBtn">Kora Ubwishyu Ubu</button>
    </form>

    <div id="statusMessage"></div>

    <a href="index.html" class="back-link">← Subira ku rupapuro rukuru</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('itemId') || 'DEFAULT_ITEM'; // Ugomba koherereza itemId (Urugero: ?itemId=ITEM_101)

    // Baza Backend iby'igicuruzwa (Izina n'Igiciro cy'ukuri)
    async function loadProductDetails() {
      try {
        const response = await fetch(`https://momo-paypack-server.onrender.com/api/products/${itemId}`);
        const product = await response.json();
        
        if (response.ok && product.success) {
          document.getElementById('displayItemName').innerText = product.data.name;
          document.getElementById('displayItemPrice').innerText = Number(product.data.price).toLocaleString() + ' RWF';
        } else {
          document.getElementById('displayItemName').innerText = 'Igicuruzwa ntikibonetse';
          document.getElementById('payBtn').disabled = true;
        }
      } catch (err) {
        console.error('Error fetching product:', err);
      }
    }

    loadProductDetails();

    document.getElementById('paymentForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      let phoneNumber = document.getElementById('phoneNumber').value.trim().replace(/\s+/g, '');
      const payBtn = document.getElementById('payBtn');
      const statusMessage = document.getElementById('statusMessage');

      // Formatting & Validation ya Nimero y'u Rwanda
      if (phoneNumber.startsWith('07')) {
        phoneNumber = '250' + phoneNumber.substring(1);
      } else if (phoneNumber.startsWith('+250')) {
        phoneNumber = phoneNumber.substring(1);
      }

      const rwandaPhoneRegex = /^2507[2389]\d{7}$/;
      if (!rwandaPhoneRegex.test(phoneNumber)) {
        statusMessage.style.display = 'block';
        statusMessage.className = 'status-error';
        statusMessage.innerText = '❌ Shyiramo nimero y\'u Rwanda y\'ukuri (Urugero: 0788XXXXXX)';
        return;
      }

      payBtn.disabled = true;
      payBtn.innerText = 'PawaPay iri gusaba ubwishyu...';
      
      statusMessage.style.display = 'block';
      statusMessage.className = 'status-pending';
      statusMessage.innerText = 'Tegereza gake, ubutumwa buri kwitegurwa kuri telefoni yawe...';

      try {
        // UMutekano: Yohereza itemId n'phoneNumber GUSA. Igiciro kiri kuri Backend!
        const response = await fetch('https://momo-paypack-server.onrender.com/api/pay', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            phoneNumber: phoneNumber,
            itemId: itemId 
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusMessage.className = 'status-success';
          statusMessage.innerText = '✅ Ubutumwa bw\'ubwishyu boherejwe kuri telefoni (' + phoneNumber + '). Emeza ugashyiramo PIN!';
        } else {
          statusMessage.className = 'status-error';
          const errorMsg = (typeof result.error === 'string') ? result.error : (result.error?.message || 'Ntabwo ubwishyu bukozwe.');
          statusMessage.innerText = '❌ Harimo ikosa: ' + errorMsg;
        }
      } catch (error) {
        console.error('Frontend Error:', error);
        statusMessage.className = 'status-error';
        statusMessage.innerText = '❌ Server ntabwo iri kuboneka. Ongera ugerageze!';
      } finally {
        payBtn.disabled = false;
        payBtn.innerText = 'Kora Ubwishyu Ubu';
      }
    });
  </script>

</body>
</html>
